name: Build and Publish Docker Images

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Micro Frontend shell + 3 remotes ────────────────────────────────
          - name: shell
            context: frontend
            dockerfile: frontend/Dockerfile
            build_args: "PROJECT=shell\nPORT=4200"
          - name: remote-conversion
            context: frontend
            dockerfile: frontend/Dockerfile
            build_args: "PROJECT=remote-conversion\nPORT=4201"
          - name: remote-observability
            context: frontend
            dockerfile: frontend/Dockerfile
            build_args: "PROJECT=remote-observability\nPORT=4202"
          - name: remote-mobile
            context: frontend
            dockerfile: frontend/Dockerfile
            build_args: "PROJECT=remote-mobile\nPORT=4203"
          # ── Gateways ─────────────────────────────────────────────────────────
          - name: web-gateway
            context: gateways/web-gateway
            dockerfile: gateways/web-gateway/Dockerfile
            build_args: ""
          - name: mobile-gateway
            context: gateways/mobile-gateway
            dockerfile: gateways/mobile-gateway/Dockerfile
            build_args: ""
          # ── Backend services ─────────────────────────────────────────────────
          - name: qr-converter-service
            context: services/qr-converter-service
            dockerfile: services/qr-converter-service/Dockerfile
            build_args: ""
          - name: upn-records-service
            context: services/upn-records-service
            dockerfile: services/upn-records-service/Dockerfile
            build_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/upnqr-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
